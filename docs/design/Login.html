<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700;">Nickname
<input type="text" value="dilnoza_bakes" autocomplete="username" style="height: 46px; padding: 0 14px; border: 1px solid #CBD2DC; border-radius: 10px; font: 500 15px 'Manrope', sans-serif; color: #0F172A;">
</label>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700;">Password
<span style="display: flex; align-items: center; height: 46px; border: 1px solid #CBD2DC; border-radius: 10px; padding-right: 6px;">
<input type="password" value="wrongpass" autocomplete="current-password" style="flex: 1; min-width: 0; height: 44px; padding: 0 14px; border: 0; border-radius: 10px; outline: none; font: 500 15px 'Manrope', sans-serif; color: #0F172A;">

</span>
</label>

<button type="submit" style="height: 50px; border-radius: 10px; border: 0; background: #4338CA; color: #FFFFFF; font: 800 15px 'Manrope', sans-serif;">Log in</button>

<div style="height: 1px; background: #EEF1F5;"></div>
<p style="margin: 0; font-size: 14px; color: #5B6475; text-align: center;">Don't have an account? <a href="Signup.html" style="font-weight: 700;">Sign up</a></p>
