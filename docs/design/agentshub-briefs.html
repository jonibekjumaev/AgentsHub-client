<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentsHub — Briefs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#101828;background:#F6F7F9}
a{color:#3730A3;text-decoration:none}a:hover{color:#312E81}
.ah-display{font-family:'Bricolage Grotesque',Inter,system-ui,sans-serif}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #818CF8;outline-offset:3px}
.ah-search-input::placeholder{color:#98A2B3}
.ah-search-input:focus{outline:none}
.ah-search-box:focus-within{box-shadow:0 0 0 4px rgba(129,140,248,0.45),0 24px 60px rgba(8,6,40,0.35)}
.ah-rail{scrollbar-width:none}.ah-rail::-webkit-scrollbar{display:none}
.ah-clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ah-brief{transition:background 0.2s}.ah-brief:hover{background:#FAFAFF}.ah-brief-link:hover{text-decoration:underline;text-underline-offset:3px}
.ah-grid3>*{min-width:0}
@media (max-width: 1024px){.ah-grid3{grid-template-columns:repeat(2,minmax(0,1fr)) !important}}
@media (max-width: 640px){.ah-grid3{grid-template-columns:1fr !important}.ah-hide-sm{display:none !important}}
@keyframes ahPopA{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes ahPopB{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.ah-pop-a{animation:ahPopA .5s cubic-bezier(.2,.7,.2,1) both}
.ah-pop-b{animation:ahPopB .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes ahBlink{0%,100%{opacity:1}50%{opacity:.35}}
.ah-live{animation:ahBlink 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.ah-pop-a,.ah-pop-b,.ah-live{animation:none}}
</style>
</head>
<body>
<!-- AgentsHub /briefs page design reference (Upwork-style feed with the Save button, D-47). The small script at
     the bottom only renders this mockup; in the real Next.js app, rebuild each section as React components. -->
<div id="app"></div>
<script type="text/x-template" id="dc-template">
<div style="min-height: 100vh; background: #F6F7F9; font-family: Inter, system-ui, sans-serif; color: #101828">

  <header style="background: #FFFFFF; border-bottom: 1px solid #E6E8EC">
    <nav aria-label="Main" style="max-width: 1240px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 36px">
        <a href="#" class="ah-display" style="font-size: 24px; font-weight: 800; letter-spacing: -0.03em; color: #101828">AgentsHub</a>
        <div style="display: flex; flex-wrap: wrap; gap: 26px; font-size: 16px; font-weight: 500">
          <a href="#" style="color: #344054">Agents</a>
          <a href="#" aria-current="page" style="color: #4338CA; font-weight: 700">Briefs</a>
          <a href="#" style="color: #344054">Creators</a>
          <a href="#" style="color: #344054">Community</a>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px">
        <a href="#" style="min-height: 44px; display: flex; align-items: center; padding: 0 20px; border: 1px solid #E4E7EC; border-radius: 10px; background: #FFFFFF; font-size: 16px; font-weight: 600; color: #101828">Log in</a>
        <a href="#" style="min-height: 44px; display: flex; align-items: center; padding: 0 20px; border-radius: 10px; background: #4338CA; font-size: 16px; font-weight: 700; color: #FFFFFF">Sign up</a>
      </div>
    </nav>
  </header>

  <section aria-labelledby="briefs-title" style="position: relative; overflow: hidden; background: #1E1B4B; color: #FFFFFF">
    <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background-image: radial-gradient(rgba(199,210,254,0.16) 1px, transparent 1.4px); background-size: 24px 24px; -webkit-mask-image: radial-gradient(ellipse 70% 90% at 50% 0%, #000 20%, transparent 80%); mask-image: radial-gradient(ellipse 70% 90% at 50% 0%, #000 20%, transparent 80%)"></div>
    <div aria-hidden="true" style="position: absolute; left: 50%; bottom: -260px; width: 900px; height: 420px; margin-left: -450px; border-radius: 50%; background: rgba(99,102,241,0.35); filter: blur(100px)"></div>
    <div style="position: relative; max-width: 960px; margin: 0 auto; padding: 56px 24px 52px; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center">
      <span style="display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; background: rgba(18,183,106,0.16); border: 1px solid rgba(110,231,183,0.35); font-size: 14px; font-weight: 600; color: #D1FADF">
        <span class="ah-live" style="width: 8px; height: 8px; border-radius: 50%; background: #32D583"></span>
        {{liveCount}} briefs open now, {{budgetTotal}} in posted budgets
      </span>
      <h1 id="briefs-title" class="ah-display" style="margin: 0; font-size: clamp(38px, 5vw, 64px); line-height: 1; font-weight: 700; letter-spacing: -0.04em; color: #FFFFFF">Agents businesses want built</h1>
      <p style="margin: 0; max-width: 560px; font-size: 18px; line-height: 1.5; color: #C7D2FE">Read what businesses need, ask questions in the comments, then reach out with an offer.</p>
      <form role="search" onSubmit="{{noSubmit}}" class="ah-search-box" style="width: 100%; max-width: 760px; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 20px; box-sizing: border-box; border-radius: 18px; background: #FFFFFF; box-shadow: 0 24px 60px rgba(8,6,40,0.35); transition: box-shadow 0.2s">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4338CA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <label for="brief-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Search briefs</label>
        <input id="brief-search" class="ah-search-input" type="search" autocomplete="off" value="{{q}}" onInput="{{onQ}}" placeholder="{{placeholder}}" style="flex: 1 1 auto; min-width: 0; height: 52px; border: 0; background: transparent; font: 500 18px Inter, sans-serif; color: #101828">
        <sc-if value="{{hasQ}}" hint-placeholder-val="{{ false }}">
          <button type="button" aria-label="Clear search" onClick="{{clearQ}}" style="flex: 0 0 auto; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: #F2F4F7; color: #344054; cursor: pointer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
          </button>
        </sc-if>
        <button type="submit" class="ah-hide-sm" style="flex: 0 0 auto; height: 52px; padding: 0 24px; border: 0; border-radius: 12px; background: #4338CA; font: 700 16px Inter, sans-serif; color: #FFFFFF; cursor: pointer">Search</button>
      </form>
      <div style="display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px">
        <span style="font-size: 14px; color: #C7D2FE">Try:</span>
        <sc-for list="{{suggestions}}" as="s" hint-placeholder-count="4">
          <button type="button" onClick="{{s.pick}}" style="min-height: 36px; padding: 0 14px; border: 1px solid rgba(199,210,254,0.35); border-radius: 999px; background: rgba(255,255,255,0.08); font: 500 14px Inter, sans-serif; color: #FFFFFF; cursor: pointer">{{s.label}}</button>
        </sc-for>
        <span aria-hidden="true" style="width: 1px; height: 22px; margin: 0 6px; background: rgba(199,210,254,0.35)"></span>
        <a href="#" style="min-height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 16px; border-radius: 999px; background: #FFFFFF; font-size: 14px; font-weight: 700; color: #1E1B4B">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          Post a brief
        </a>
      </div>
    </div>
  </section>

  <div style="position: sticky; top: 0; z-index: 5; background: rgba(246,247,249,0.92); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid #E4E7EC">
    <div style="max-width: 1240px; margin: 0 auto; padding: 14px 24px; display: flex; flex-direction: column; gap: 12px">
      <div class="ah-rail" role="group" aria-label="Category" style="display: flex; gap: 8px; overflow-x: auto; padding: 2px">
        <sc-for list="{{catPills}}" as="c" hint-placeholder-count="9">
          <button type="button" aria-pressed="{{c.pressed}}" disabled="{{c.disabled}}" onClick="{{c.toggle}}" style="flex: 0 0 auto; min-height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 14px 0 8px; border-radius: 999px; border: 1px solid {{c.border}}; background: {{c.bg}}; font: 600 14px Inter, sans-serif; color: {{c.fg}}; opacity: {{c.opacity}}; cursor: pointer; transition: background 0.2s, border-color 0.2s, color 0.2s">
            <span style="width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{c.iconBg}}; color: {{c.ink}}">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.d1}}"></path><path d="{{c.d2}}"></path></svg>
            </span>
            {{c.label}}
            <span style="min-width: 22px; padding: 2px 7px; box-sizing: border-box; border-radius: 999px; background: {{c.countBg}}; font-size: 12px; font-weight: 700; color: {{c.countFg}}">{{c.count}}</span>
          </button>
        </sc-for>
      </div>
      <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
          <div role="tablist" aria-label="Brief status" style="display: flex; padding: 3px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E4E7EC">
            <sc-for list="{{statusTabs}}" as="t" hint-placeholder-count="2">
              <button type="button" role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="min-height: 32px; padding: 0 12px; border: 0; border-radius: 7px; background: {{t.bg}}; font: 700 14px Inter, sans-serif; color: {{t.fg}}; cursor: pointer; transition: background 0.2s, color 0.2s">{{t.label}} <span style="font-weight: 500; opacity: 0.75">{{t.count}}</span></button>
            </sc-for>
          </div>
          <span aria-hidden="true" class="ah-hide-sm" style="width: 1px; height: 26px; background: #D0D5DD; margin: 0 4px"></span>
          <div role="group" aria-label="Budget" style="display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{budgetChips}}" as="p" hint-placeholder-count="2">
              <button type="button" aria-pressed="{{p.pressed}}" disabled="{{p.disabled}}" onClick="{{p.toggle}}" style="min-height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid {{p.border}}; background: {{p.bg}}; font: 600 14px Inter, sans-serif; color: {{p.fg}}; opacity: {{p.opacity}}; cursor: pointer; transition: background 0.2s, color 0.2s">{{p.label}} <span style="font-weight: 500; opacity: 0.75">{{p.count}}</span></button>
            </sc-for>
          </div>
          <button type="button" role="switch" aria-checked="{{hidePastStr}}" onClick="{{toggleHidePast}}" style="min-height: 38px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border: 1px solid #E4E7EC; border-radius: 10px; background: #FFFFFF; font: 600 14px Inter, sans-serif; color: #344054; cursor: pointer">
            <span aria-hidden="true" style="position: relative; width: 34px; height: 20px; border-radius: 999px; background: {{switchBg}}; transition: background 0.2s">
              <span style="position: absolute; top: 2px; left: {{knobLeft}}; width: 16px; height: 16px; border-radius: 50%; background: #FFFFFF; transition: left 0.2s"></span>
            </span>
            Hide past deadline
          </button>
        </div>
        <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #475467">Sort
          <select value="{{sort}}" onChange="{{onSort}}" style="min-height: 38px; padding: 0 12px; border: 1px solid #E4E7EC; border-radius: 10px; background: #FFFFFF; font: 600 14px Inter, sans-serif; color: #101828; cursor: pointer">
            <option value="newest">Newest</option>
            <option value="budget">Highest budget</option>
            <option value="deadline">Deadline soonest</option>
            <option value="discussed">Most discussed</option>
          </select>
        </label>
      </div>
    </div>
  </div>

  <main style="max-width: 1240px; margin: 0 auto; padding: 28px 24px 96px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px">
      <p aria-live="polite" style="margin: 0; font-size: 16px; color: #475467"><b class="ah-display" style="font-size: 22px; letter-spacing: -0.02em; color: #101828">{{resultCount}}</b> {{resultWord}}{{queryNote}}</p>
      <sc-if value="{{hasApplied}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
          <sc-for list="{{applied}}" as="f" hint-placeholder-count="2">
            <button type="button" onClick="{{f.remove}}" aria-label="Remove filter {{f.label}}" style="min-height: 34px; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 12px; border: 0; border-radius: 999px; background: #EEF0FF; font: 600 13px Inter, sans-serif; color: #3730A3; cursor: pointer">
              {{f.label}}
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
            </button>
          </sc-for>
          <button type="button" onClick="{{clearAll}}" style="min-height: 34px; padding: 0 10px; border: 0; background: transparent; font: 700 13px Inter, sans-serif; color: #475467; text-decoration: underline; cursor: pointer">Clear all</button>
        </div>
      </sc-if>
      <sc-if value="{{hasHidden}}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{toggleHidePast}}" style="min-height: 34px; padding: 0 4px; border: 0; background: transparent; font: 600 13px Inter, sans-serif; color: #667085; text-decoration: underline; cursor: pointer">{{hiddenNote}}</button>
      </sc-if>
    </div>

    <sc-if value="{{hasResults}}" hint-placeholder-val="{{ true }}">
      <ol style="margin: 0; padding: 0; list-style: none; border-radius: 22px; background: #FFFFFF; border: 1px solid #E4E7EC; overflow: hidden">
        <sc-for list="{{visible}}" as="b" hint-placeholder-count="5">
          <li class="{{b.cls}} ah-brief" style="animation-delay: {{b.delay}}; border-top: {{b.divider}}; opacity: {{b.dim}}">
            <article style="display: flex; flex-wrap: wrap; gap: 20px 40px; padding: 26px 28px">
              <div style="flex: 999 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
                <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px">
                  <span style="display: flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: {{b.statusBg}}; font-size: 12px; font-weight: 700; color: {{b.statusFg}}"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{b.statusDot}}"></span>{{b.statusLabel}}</span>
                  <span style="display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 4px; border-radius: 999px; background: {{b.tint}}; font-size: 12px; font-weight: 700; color: {{b.inkText}}">
                    <span style="width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #FFFFFF; color: {{b.ink}}">
                      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.d1}}"></path><path d="{{b.d2}}"></path></svg>
                    </span>
                    {{b.cat}}
                  </span>
                  <span style="font-size: 13px; color: #667085">Posted {{b.when}}</span>
                </div>
                <h2 class="ah-display" style="margin: 0; font-size: 23px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em"><a href="#" class="ah-brief-link" style="color: #101828">{{b.title}}</a></h2>
                <p style="margin: 0; max-width: 760px; font-size: 16px; line-height: 1.55; color: #344054">{{b.body}}</p>
                <dl style="margin: 4px 0 0; display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 14px">
                  <div style="display: flex; align-items: center; gap: 6px">
                    <dt style="display: flex; color: #667085"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="2"></rect><path d="M12 10v5M9.5 12.5h5"></path></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Budget type</span></dt>
                    <dd style="margin: 0; font-weight: 600; color: #344054">{{b.budgetKind}}</dd>
                  </div>
                  <div style="display: flex; align-items: center; gap: 6px">
                    <dt style="display: flex; color: {{b.dueFg}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Deadline</span></dt>
                    <dd style="margin: 0; font-weight: 600; color: {{b.dueFg}}">{{b.dueLong}}</dd>
                  </div>
                  <div style="display: flex; align-items: center; gap: 6px">
                    <dt style="display: flex; color: #667085"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"></path></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Questions</span></dt>
                    <dd style="margin: 0; font-weight: 600; color: #344054">{{b.commentsLabel}}</dd>
                  </div>
                  <div style="display: flex; align-items: center; gap: 6px">
                    <dt style="display: flex; color: #667085"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Views</span></dt>
                    <dd style="margin: 0; font-weight: 600; color: #344054">{{b.viewsLabel}}</dd>
                  </div>
                </dl>
                <div style="display: flex; align-items: center; gap: 10px; margin-top: 6px">
                  <span style="flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #EEF0FF; font-size: 11px; font-weight: 800; color: #3730A3">{{b.initials}}</span>
                  <span style="font-size: 14px; font-weight: 600; color: #101828">{{b.who}}</span>
                  <span style="display: flex; align-items: center; gap: 5px; font-size: 13px; color: #667085">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11h14v10H5z"></path><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
                    Contact after sign-in
                  </span>
                </div>
              </div>
              <div style="flex: 1 0 200px; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: 18px; text-align: right">
                <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
                  <span style="font-size: 13px; color: #667085">Budget</span>
                  <span class="ah-display" style="font-size: 30px; line-height: 1; font-weight: 800; letter-spacing: -0.03em; color: {{b.budgetFg}}">{{b.budgetLabel}}</span>
                </div>
                <div style="display: flex; align-items: center; gap: 8px">
                  <button type="button" aria-label="{{b.saveLabel}}" aria-pressed="{{b.savedStr}}" onClick="{{b.toggleSave}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid {{b.saveBorder}}; border-radius: 12px; background: {{b.saveBg}}; color: {{b.saveFg}}; cursor: pointer; transition: background 0.2s, color 0.2s">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="{{b.saveFill}}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4Z"></path></svg>
                  </button>
                  <a href="#" style="min-height: 44px; display: flex; align-items: center; padding: 0 18px; border-radius: 12px; background: #101828; font-size: 15px; font-weight: 700; color: #FFFFFF">View brief</a>
                </div>
              </div>
            </article>
          </li>
        </sc-for>
        <li style="border-top: 1px solid #EEF0F4; background: #FAFAFF">
          <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 24px; padding: 22px 28px">
            <span style="display: flex; flex-direction: column; gap: 4px">
              <span class="ah-display" style="font-size: 20px; font-weight: 700; letter-spacing: -0.015em">Need an agent built?</span>
              <span style="font-size: 15px; color: #475467">Describe the job in a brief. Creators who build custom agents will see it today.</span>
            </span>
            <a href="#" style="min-height: 44px; display: flex; align-items: center; padding: 0 20px; border-radius: 12px; background: #4338CA; font-size: 15px; font-weight: 700; color: #FFFFFF">Post a brief</a>
          </div>
        </li>
      </ol>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 12px">
        <span style="font-size: 14px; color: #475467">Showing {{shownCount}} of {{resultCount}}</span>
        <div aria-hidden="true" style="width: 220px; height: 4px; border-radius: 999px; background: #E4E7EC; overflow: hidden">
          <div style="width: {{progress}}; height: 100%; border-radius: 999px; background: #4338CA; transition: width 0.4s ease"></div>
        </div>

<script>

      clearAll: function () { self.change({ q: '', cats: {}, budget: {}, status: 'open' }); },
      hasHidden: hiddenCount > 0,
      hiddenNote: hiddenCount + (hiddenCount === 1 ? ' brief is' : ' briefs are') + ' past deadline. Show them',
      hasResults: total > 0,
      noResults: total === 0,
      emptyTitle: closedEmpty ? 'No closed briefs yet' : 'No brief matches this',
      emptyBody: closedEmpty ? 'When a business picks a creator and closes its brief, it appears here.' : 'Remove a filter to widen the search, or post the brief yourself.',
      briefSuffix: st.q.trim() && !closedEmpty ? ' for “' + st.q.trim() + '”' : '',
      visible: visible,
      shownCount: shownCount,
      progress: total ? Math.round(shownCount / total * 100) + '%' : '0%',
      hasMore: shownCount < total,
      moreCount: Math.min(6, total - shownCount),
      loadMore: function () { self.setState({ limit: self.state.limit + 6 }); }
    };
  }
}
window.__mountDC(Component);
</script>
