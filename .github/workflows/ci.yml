name: CI

on:
  pull_request:
  push:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung build or test run fails the job instead of burning minutes for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      # src/gql is committed, so CI needs no running API. Public example values only (no secrets).
      - name: Environment
        run: cp .env.example .env.local

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      # The home page is ISR: at build time the API is unreachable here, so its lists render empty. That's fine for CI.
      - name: Build
        run: yarn build
